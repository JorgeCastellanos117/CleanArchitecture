name: SonarQube Analysis
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Instalar scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Build y análisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          KEY=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2 | tr -d '\r')
          ORG=$(grep '^sonar.organization=' sonar-project.properties | cut -d= -f2 | tr -d '\r')
          echo "Project key: $KEY"
          echo "Organization: $ORG"
          dotnet sonarscanner begin /k:"$KEY" /o:"$ORG" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build -p:NuGetAudit=false -p:TreatWarningsAsErrors=false
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN" 
